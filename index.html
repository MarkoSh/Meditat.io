  { tag: 'proof', t: tri('MBSR против эсциталопрама', 'MBSR versus escitalopram', 'MBSR เทียบกับยาเอสซิทาโลแพรม'),
    d: tri('276 взрослых с тревожными расстройствами: восемь недель MBSR оказались не хуже популярного антидепрессанта. Это не повод бросать лекарства самому — только вместе с врачом.', '276 adults with anxiety disorders: eight weeks of MBSR did no worse than a common antidepressant. That is no reason to stop medication on your own; only with your doctor.', 'ผู้ใหญ่ 276 คนที่มีโรควิตกกังวล MBSR แปดสัปดาห์ได้ผลไม่ด้อยกว่ายาต้านซึมเศร้าที่ใช้กันทั่วไป แต่ไม่ใช่เหตุผลให้หยุดยาเอง ต้องปรึกษาแพทย์เท่านั้น'),
    src: ['Hoge et al., JAMA Psychiatry, 2023', 'https://doi.org/10.1001/jamapsychiatry.2022.3679'] },
  { tag: 'data', t: tri('Блуждающий ум — несчастный ум', 'A wandering mind is an unhappy mind', 'ใจที่ล่องลอยคือใจที่ไม่มีความสุข'),
    d: tri('Приложение спрашивало 2250 человек в случайные моменты дня, чем они заняты. В 46,9% случаев мысли были не о текущем деле — и в эти моменты люди оценивали себя менее счастливыми.', 'An app asked 2,250 people at random moments what they were doing. 46.9% of the time their mind was elsewhere, and at those moments they rated themselves less happy.', 'แอปสุ่มถามคน 2,250 คนว่ากำลังทำอะไร 46.9% ของเวลา ใจไม่ได้อยู่กับสิ่งที่ทำ และในช่วงนั้นพวกเขาให้คะแนนความสุขต่ำกว่า'),
    src: ['Killingsworth & Gilbert, Science, 2010', 'https://doi.org/10.1126/science.1192439'] },
  { tag: 'data', t: tri('13 минут в день', '13 minutes a day', 'วันละ 13 นาที'),
    d: tri('Новички восемь недель медитировали по 13 минут в день: улучшились внимание, рабочая память, узнавание и настроение. Через четыре недели эффекта ещё не было — нужна регулярность. Выборка небольшая (42 человека).', 'Beginners meditated 13 minutes a day for eight weeks: attention, working memory, recognition and mood improved. After four weeks there was no effect yet, so consistency matters. The sample was small (42 people).', 'ผู้เริ่มต้นนั่งสมาธิวันละ 13 นาทีเป็นเวลาแปดสัปดาห์ สมาธิ ความจำใช้งาน การจำได้ และอารมณ์ดีขึ้น แต่หลังสี่สัปดาห์ยังไม่เห็นผล ความสม่ำเสมอจึงสำคัญ กลุ่มตัวอย่างเล็ก (42 คน)'),
    src: ['Basso et al., Behavioural Brain Research, 2019', 'https://doi.org/10.1016/j.bbr.2018.08.023'] },
  { tag: 'data', t: tri('Эффект за несколько дней', 'Effects within days', 'เห็นผลในไม่กี่วัน'),
    d: tri('Четыре занятия по 20 минут улучшили внимание и рабочую память у новичков (Zeidan, 2010). Пять дней по 20 минут — внимание лучше и кортизола меньше после стресса (Tang, 2007). Короткие исследования, но показывают, что начать можно с малого.', 'Four 20-minute sessions improved beginners’ attention and working memory (Zeidan, 2010). Five days of 20 minutes: better attention and less cortisol after stress (Tang, 2007). Short studies, but they show you can start small.', 'ฝึกสี่ครั้ง ครั้งละ 20 นาที ช่วยให้ผู้เริ่มต้นมีสมาธิและความจำใช้งานดีขึ้น (Zeidan ค.ศ. 2010) ฝึกห้าวัน วันละ 20 นาที สมาธิดีขึ้นและคอร์ติซอลหลังความเครียดน้อยลง (Tang ค.ศ. 2007) เป็นงานวิจัยระยะสั้น แต่แสดงว่าเริ่มจากน้อย ๆ ได้'),
    src: ['Zeidan et al., Consciousness and Cognition, 2010', 'https://doi.org/10.1016/j.concog.2010.03.014'] },
  { tag: 'proof', t: tri('Дыхание поднимает настроение', 'Breathing lifts mood', 'การหายใจช่วยให้อารมณ์ดี'),
    d: tri('111 человек месяц делали по 5 минут в день: циклический вздох, квадратное дыхание, быстрое дыхание или медитацию осознанности. Дыхательные практики — особенно с длинным выдохом — подняли настроение сильнее медитации.', '111 people spent 5 minutes a day for a month on cyclic sighing, box breathing, fast breathing or mindfulness meditation. The breathing practices, especially with a long out-breath, lifted mood more than meditation.', 'คน 111 คนฝึกวันละ 5 นาทีเป็นเวลาหนึ่งเดือน แบ่งเป็นถอนหายใจเป็นรอบ หายใจสี่เหลี่ยม หายใจเร็ว หรือฝึกสติ การหายใจ โดยเฉพาะแบบหายใจออกยาว ช่วยให้อารมณ์ดีขึ้นมากกว่าการฝึกสติ'),
    src: ['Balban et al., Cell Reports Medicine, 2023', 'https://doi.org/10.1016/j.xcrm.2022.100895'] },
  { tag: 'data', t: tri('Сон', 'Sleep', 'การนอนหลับ'),
    d: tri('18 исследований, 1654 человека: медитация осознанности умеренно улучшает качество сна — заметно лучше, чем ничего, и примерно наравне с другими проверенными подходами.', '18 trials, 1,654 people: mindfulness meditation moderately improves sleep quality, clearly better than nothing and roughly on a par with other proven approaches.', '18 การทดลอง 1,654 คน การฝึกสติช่วยให้คุณภาพการนอนดีขึ้นปานกลาง ดีกว่าไม่ทำอะไรชัดเจน และใกล้เคียงกับวิธีอื่นที่พิสูจน์แล้ว'),
    src: ['Rusch et al., Annals of the NY Academy of Sciences, 2019', 'https://doi.org/10.1111/nyas.13996'] },
  { tag: 'data', t: tri('Доброта копится', 'Kindness adds up', 'ความเมตตาสะสมได้'),
    d: tri('Семь недель практики метты: у людей прибавилось хороших эмоций в обычные дни, а вместе с ними — ощущения смысла, поддержки и удовлетворённости жизнью.', 'Seven weeks of loving-kindness practice: people felt more positive emotions on ordinary days, and with them more purpose, support and life satisfaction.', 'ฝึกแผ่เมตตาเจ็ดสัปดาห์ ผู้คนมีอารมณ์ดีในวันธรรมดามากขึ้น พร้อมกับรู้สึกมีความหมาย มีคนสนับสนุน และพอใจในชีวิตมากขึ้น'),
    src: ['Fredrickson et al., JPSP, 2008', 'https://doi.org/10.1037/a0013262'] },
  { tag: 'data', t: tri('Боль ощущается иначе', 'Pain feels different', 'ความเจ็บปวดรู้สึกต่างไป'),
    d: tri('После четырёх дней тренировки участники в томографе оценивали ожог горячей пластиной как на 57% менее неприятный и на 40% менее сильный, пока медитировали.', 'After four days of training, people in a scanner rated a heat stimulus 57% less unpleasant and 40% less intense while meditating.', 'หลังฝึกสี่วัน ผู้เข้าร่วมในเครื่องสแกนสมองประเมินความร้อนที่ผิวว่าไม่สบายน้อยลง 57% และรุนแรงน้อยลง 40% ขณะทำสมาธิ'),
    src: ['Zeidan et al., Journal of Neuroscience, 2011', 'https://doi.org/10.1523/JNEUROSCI.5791-10.2011'] },
  { tag: 'data', t: tri('Обычным людям — без чудес', 'For ordinary people: no miracles', 'สำหรับคนทั่วไป ไม่มีปาฏิหาริย์'),
    d: tri('136 исследований, 11 605 взрослых вне клиники: осознанность снижает тревогу, депрессию и стресс по сравнению с бездействием — но не лучше других полезных занятий, например спорта.', '136 trials, 11,605 adults outside clinics: mindfulness reduces anxiety, depression and stress compared with doing nothing, but no more than other good activities such as exercise.', '136 การทดลอง ผู้ใหญ่ 11,605 คนนอกคลินิก การฝึกสติลดความวิตก ซึมเศร้า และความเครียดได้เมื่อเทียบกับไม่ทำอะไร แต่ไม่มากกว่ากิจกรรมดี ๆ อื่น เช่น การออกกำลังกาย'),
    src: ['Galante et al., PLOS Medicine, 2021', 'https://doi.org/10.1371/journal.pmed.1003481'] },
  { tag: 'debate', t: tri('«Медитация перестраивает мозг»?', '“Meditation rewires the brain”?', 'สมาธิเปลี่ยนโครงสร้างสมอง จริงไหม'),
    d: tri('Знаменитая работа 2011 года нашла больше серого вещества после MBSR — у 16 человек. Повтор на 218 участниках в двух рандомизированных исследованиях структурных изменений за восемь недель не нашёл (Kral, 2022).', 'A famous 2011 paper found more grey matter after MBSR, in 16 people. A repeat with 218 participants in two randomised trials found no structural change after eight weeks (Kral, 2022).', 'งานวิจัยดังปี 2011 พบเนื้อสมองสีเทาเพิ่มขึ้นหลัง MBSR แต่ศึกษาเพียง 16 คน การทำซ้ำกับ 218 คนในการทดลองแบบสุ่มสองชิ้น ไม่พบการเปลี่ยนแปลงโครงสร้างใน 8 สัปดาห์ (Kral ค.ศ. 2022)'),
    src: ['Kral et al., Science Advances, 2022', 'https://doi.org/10.1126/sciadv.abk3316'] },
  { tag: 'data', t: tri('Тише «внутренний болтун»', 'A quieter inner chatter', 'เสียงพูดในหัวเบาลง'),
    d: tri('У опытных медитирующих сеть пассивного режима — та, что включается при блуждании ума и мыслях о себе, — во время практики была менее активна. Это сравнение групп, а не доказательство, что так сделала медитация.', 'In experienced meditators the default mode network, active during mind-wandering and self-focused thought, was less active during practice. This compares groups; it does not prove meditation caused it.', 'ในผู้ที่ฝึกสมาธิมานาน เครือข่ายโหมดพื้นฐานของสมอง ที่ทำงานตอนใจล่องลอยและคิดเรื่องตัวเอง ทำงานน้อยลงขณะฝึก เป็นการเปรียบเทียบกลุ่ม ยังไม่ได้พิสูจน์ว่าสมาธิเป็นสาเหตุ'),
    src: ['Brewer et al., PNAS, 2011', 'https://doi.org/10.1073/pnas.1112029108'] },
  { tag: 'debate', t: tri('Гамма-волны монахов', 'Monks’ gamma waves', 'คลื่นแกมมาของพระ'),
    d: tri('Восемь тибетских монахов с 10–50 тысячами часов практики показали мощные гамма-ритмы во время медитации сострадания. Яркий результат — но восемь человек и десятилетия практики; к десяти минутам в приложении это не относится.', 'Eight Tibetan monks with 10,000–50,000 hours of practice showed strong gamma rhythms during compassion meditation. A striking result, but eight people and decades of practice; it says nothing about ten minutes in an app.', 'พระทิเบตแปดรูปที่ฝึกมา 10,000–50,000 ชั่วโมงแสดงคลื่นแกมมาแรงขณะเจริญกรุณา ผลน่าทึ่ง แต่มีแค่แปดคนและฝึกมาหลายสิบปี ไม่ได้บอกอะไรเกี่ยวกับการฝึกสิบนาทีในแอป'),
    src: ['Lutz et al., PNAS, 2004', 'https://doi.org/10.1073/pnas.0407401101'] },
  { tag: 'debate', t: tri('Давление и сердце', 'Blood pressure and the heart', 'ความดันและหัวใจ'),
    d: tri('Американская кардиологическая ассоциация: медитация «может рассматриваться» как дополнение для снижения давления и сердечного риска — польза возможна, но данных мало. Лекарства и образ жизни она не заменяет.', 'The American Heart Association: meditation “may be considered” as an add-on to lower blood pressure and cardiovascular risk; a benefit is possible but the data are limited. It does not replace medication or lifestyle.', 'สมาคมโรคหัวใจอเมริกัน: อาจพิจารณาใช้สมาธิเป็นส่วนเสริมเพื่อลดความดันและความเสี่ยงโรคหัวใจ อาจมีประโยชน์ แต่ข้อมูลยังน้อย ไม่ได้ทดแทนยาหรือการปรับวิถีชีวิต'),
    src: ['Levine et al., JAHA, 2017', 'https://doi.org/10.1161/JAHA.117.002218'] },
  { tag: 'debate', t: tri('Осознанность в школах', 'Mindfulness in schools', 'การฝึกสติในโรงเรียน'),
    d: tri('Крупнейшее исследование MYRIAD: 8376 подростков в 84 школах Великобритании. Уроки осознанности не улучшили самочувствие по сравнению с обычными уроками о здоровье.', 'The largest study, MYRIAD: 8,376 teenagers in 84 UK schools. Mindfulness lessons did not improve wellbeing compared with usual health lessons.', 'งานวิจัยใหญ่ที่สุด MYRIAD วัยรุ่น 8,376 คนใน 84 โรงเรียนในสหราชอาณาจักร บทเรียนฝึกสติไม่ได้ทำให้สุขภาวะดีขึ้นกว่าบทเรียนสุขภาพตามปกติ'),
    src: ['Kuyken et al., Evidence-Based Mental Health, 2022', 'https://doi.org/10.1136/ebmental-2021-300396'] },
  { tag: 'debate', t: tri('Осторожно, хайп', 'Mind the hype', 'ระวังกระแสเกินจริง'),
    d: tri('Пятнадцать учёных, сами изучающие медитацию: «осознанность» понимают по-разному, исследования часто маленькие и без активного контроля, СМИ преувеличивают. Читайте заголовки с поправкой.', 'Fifteen scientists who study meditation themselves: “mindfulness” means different things, studies are often small and lack active controls, and the media exaggerate. Read the headlines with care.', 'นักวิทยาศาสตร์สิบห้าคนที่วิจัยเรื่องสมาธิเอง เตือนว่าคำว่าสติถูกนิยามต่างกัน งานวิจัยมักเล็กและไม่มีกลุ่มเปรียบเทียบที่ทำกิจกรรมอื่น สื่อมักพูดเกินจริง อ่านพาดหัวข่าวอย่างระวัง'),
    src: ['Van Dam et al., Perspectives on Psychological Science, 2018', 'https://doi.org/10.1177/1745691617709589'] },
];

const TRADITIONS = [
  { icon: 'wind', tags: ['ancient'], era: tri('Палийский канон, ~V в. до н. э.', 'Pali Canon, ~5th c. BCE', 'พระไตรปิฎกบาลี ราว 500 ปีก่อน ค.ศ.'), t: tri('Анапанасати', 'Ānāpānasati', 'อานาปานสติ'),
    d: tri('Осознанность вдоха и выдоха в 16 шагах — от «длинный вдох — знаю, что длинный» до спокойствия ума (Анапанасати-сутта, MN 118). Основа почти всех дыхательных медитаций.', 'Mindfulness of the in- and out-breath in 16 steps, from “breathing in long, I know I breathe in long” to a calm mind (Ānāpānasati Sutta, MN 118). The root of almost every breath meditation.', 'การมีสติรู้ลมหายใจเข้าออก 16 ขั้น ตั้งแต่ หายใจเข้ายาวก็รู้ว่ายาว จนถึงจิตสงบ (อานาปานสติสูตร ม.อุ. 118) รากฐานของสมาธิกับลมหายใจแทบทุกแบบ') },
  { icon: 'heart', tags: ['ancient'], era: tri('Метта-сутта; Буддхагхоса, V в.', 'Metta Sutta; Buddhaghosa, 5th c.', 'กรณียเมตตสูตร พระพุทธโฆสะ คริสต์ศตวรรษที่ 5'), t: tri('Метта', 'Mettā', 'เมตตา'),
    d: tri('Доброжелательность по кругу: себе, другу, нейтральному, трудному человеку, всем. Порядок расписан в «Висуддхимагге» — и почти без изменений живёт в современных программах.', 'Goodwill in widening circles: yourself, a friend, a neutral person, a difficult one, everyone. The order is set out in the Visuddhimagga and lives on almost unchanged in modern programmes.', 'ความปรารถนาดีเป็นวงกว้างออกไป ตัวเอง เพื่อน คนกลาง ๆ คนที่ยาก และทุกชีวิต ลำดับนี้อยู่ในคัมภีร์วิสุทธิมรรค และแทบไม่เปลี่ยนในโปรแกรมสมัยใหม่') },
  { icon: 'trees', tags: ['ancient'], era: tri('Таиланд, XX век', 'Thailand, 20th c.', 'ประเทศไทย คริสต์ศตวรรษที่ 20'), t: tri('Тайская лесная традиция', 'Thai Forest Tradition', 'พระป่าสายหลวงปู่มั่น'),
    d: tri('Аджан Ман, Аджан Чаа: на вдохе про себя «Бут», на выдохе «тхо» — พุท-โธ, «пробуждённый». И ходьба จงกรม по дорожке между деревьями. Отсюда вышли многие западные учителя.', 'Ajahn Mun, Ajahn Chah: silently “Bud” on the in-breath, “dho” on the out-breath, พุท-โธ, “awake”. Plus walking จงกรม on a path between the trees. Many Western teachers came from here.', 'หลวงปู่มั่น หลวงพ่อชา หายใจเข้า พุท หายใจออก โธ และเดินจงกรมบนทางระหว่างต้นไม้ ครูสมาธิชาวตะวันตกหลายคนก็มาจากสายนี้') },
  { icon: 'circle', tags: ['ancient'], era: tri('Догэн, Япония, XIII век', 'Dōgen, Japan, 13th c.', 'โดเง็น ญี่ปุ่น คริสต์ศตวรรษที่ 13'), t: tri('Дзадзэн', 'Zazen', 'ซาเซ็น'),
    d: tri('«Просто сидеть»: устойчивая поза, взгляд вниз, ничего не добиваться. Новичкам дают счёт дыхания до десяти — сусокукан, а между сидениями — медленную ходьбу кинхин.', '“Just sitting”: a steady posture, eyes lowered, nothing to achieve. Beginners count breaths to ten (susokukan) and walk slowly between sittings (kinhin).', 'นั่งเฉย ๆ ท่ามั่นคง สายตาลง ไม่ต้องไปให้ถึงอะไร ผู้เริ่มต้นนับลมหายใจถึงสิบ และเดินช้า ๆ ระหว่างรอบนั่ง') },
  { icon: 'sun', tags: ['ancient'], era: tri('Патанджали, ~II в. до н. э. – V в. н. э.', 'Patañjali, ~2nd c. BCE – 5th c. CE', 'ปตัญชลี ราว 200 ปีก่อน ค.ศ. ถึงคริสต์ศตวรรษที่ 5'), t: tri('Йога-сутры', 'Yoga Sutras', 'โยคสูตร'),

const LOG_KEY = 'md:log';
const log = () => { try { return JSON.parse(store.get(LOG_KEY, '[]')) } catch (e) { return [] } };
function record(k, sec) { if (sec < 30) return; const l = log(); l.push({ k, s: Math.round(sec), d: Date.now() }); store.set(LOG_KEY, JSON.stringify(l.slice(-1000))) }
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth() + 1}-${x.getDate()}` };
// consecutive days with practice, ending today (or yesterday, so the streak survives until today's session)
function streaks() {
  const days = new Set(log().map(x => dayKey(x.d)));
  let best = 0, run = 0, cur = 0;
  const first = log()[0]?.d ?? Date.now();
  for (let d = new Date(first); d <= new Date(); d.setDate(d.getDate() + 1)) { run = days.has(dayKey(d)) ? run + 1 : 0; best = Math.max(best, run) }
  const day = new Date();
  if (!days.has(dayKey(day))) day.setDate(day.getDate() - 1);
  while (days.has(dayKey(day))) { cur++; day.setDate(day.getDate() - 1) }
  return { cur, best };
}
const nameOf = k => k === 'timer' ? t('tmName') : L((PR[k] || BR[k]).t);

/* ================= BELL ================= */
// a singing-bowl strike at 432 Hz with a few inharmonic overtones (WebAudio, no files)
const ac = () => bell.ac || (bell.ac = new (window.AudioContext || window.webkitAudioContext)());
function bell(times = 1, vol = .22) {
  try {
    const a = ac(); a.resume();
    for (let i = 0; i < times; i++) {
      const t0 = a.currentTime + i * 2.6;
      [[1, 1], [2.71, .35], [5.15, .12]].forEach(([r, v]) => {
        const o = a.createOscillator(), g = a.createGain();
        o.frequency.value = 432 * r; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol * v, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + 7 / Math.sqrt(r));
        o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + 8);
      });
    }
  } catch (e) {}
}

function startSession() {

function tick() {

  s.last = now;

  $('#pBar').style.width = `${s.el / s.total * 100}%`;
  $('#pLeft').textContent = fill(t('pLeft'), { t: mm(Math.ceil(s.total - s.el)) });
  const line = $('#pLine');
  if (s.kind === 'practice') {
    const i = s.audio ? -2 : s.item.script.findLastIndex(([sec]) => sec <= s.el);
    if (i !== s.line) { s.line = i; line.innerHTML = `<span class="fade-up block">${i === -2 ? `<span class="text-base text-zinc-500">${t('pVoice')}</span>` : L(s.item.script[i][1])}</span>` }

  const bm = e.target.closest('[data-brmin]'), tm = e.target.closest('[data-tmmin]'), ti = e.target.closest('[data-tmiv]');
  if (bm) { brMin = +bm.dataset.brmin; store.set('md-brmin', brMin); renderBreath(); renderHero(); icons() }
  if (tm) { tmMin = +tm.dataset.tmmin; store.set('md-tmmin', tmMin); renderTimer(); icons() }
  if (ti) { tmIv = +ti.dataset.tmiv; store.set('md-tmiv', tmIv); renderTimer(); icons() }
});
$('#statsReset').onclick = () => { if (confirm(t('stConfirm'))) { store.del(LOG_KEY); renderSide() } };

function renderAll() {
  renderText(); renderHero(); renderPractices(); renderBreath(); renderTimer(); renderScience(); renderTraditions(); renderSafety(); renderStats(); renderMore(); navFill();
  if (S) renderPlayer();
  icons();
}
$$('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('md-lang', lang); renderAll() });

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08 });
$$('.reveal').forEach(el => io.observe(el));
renderAll();

/* ================= OFFLINE ================= */
// sw.js keeps the whole site (page, audio, libraries, fonts) for use without internet and, when online,
// downloads only what changed (offline.json, written by ThaiFast/tools/offline.py)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const OFF = {
    ru: ['Сохраняем сайт для работы без интернета: {p}%', 'Сайт сохранён — работает и без интернета', 'Нет сети — открыта сохранённая версия'],
    en: ['Saving the site for offline use: {p}%', 'Saved — the site works without internet too', 'Offline — showing the saved version'],
    th: ['กำลังบันทึกเว็บไว้ใช้แบบออฟไลน์: {p}%', 'บันทึกแล้ว ใช้งานได้แม้ไม่มีอินเทอร์เน็ต', 'ไม่มีอินเทอร์เน็ต กำลังแสดงเวอร์ชันที่บันทึกไว้'],
  };
  const offSay = (i, p) => { const el = document.getElementById('offlineState'); if (el) el.textContent = (OFF[document.documentElement.lang] || OFF.en)[i].replace('{p}', p) };
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'offline') return;
    if (d.offline) offSay(2); else if (d.done < d.total) offSay(0, Math.floor(d.done / d.total * 100)); else offSay(1);
  });
  addEventListener('offline', () => offSay(2));
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
      .then(r => r.active && r.active.postMessage({ type: 'sync', full: !(navigator.connection && navigator.connection.saveData) }))
      .catch(() => {});
  });
}
</script>
